   THEME TOKENS — sampled from the LIVE Flourish app.
   A light theme = redefine ONLY this :root block. Layout stays put.
   =================================================================== */
:root{
  --black:#000000;            /* top bar + sidebar */
  --app:#0D0A0F;              /* main canvas (subtle violet-black) */
  --surface:#18181B;          /* panels / empty columns / composer */
  --card:#13101A;             /* project card (subtle tint) */
  --elevated:#1E1B24;         /* reasoning / tool bars */

  --border-2:rgba(255,255,255,0.12);

  --text-2:rgba(255,255,255,0.72);

/* ---- app frame ---- */
.app{max-width:1280px;margin:0 auto 42px;height:620px;display:flex;background:var(--app);

svg{display:block}

.side{width:250px;flex:none;background:var(--black);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.side-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}

.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.uava{width:26px;height:26px;border-radius:50%;background:#3a3a42;flex:none}
.uname{font-size:13px;font-weight:600}
.side-foot .grow{flex:1}
.fi{color:#7c7c85}

/* ===================== MAIN ===================== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

.ws-tools{display:flex;gap:13px;color:#6b6b72;margin-top:7px}
.ws-right{display:flex;align-items:center;gap:12px}
.cat-pill{display:flex;align-items:center;gap:9px;background:#15151a;border:1px solid var(--border-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text-2)}
.ws-right .avg{width:26px;height:26px;border:2px solid var(--black)}

.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
.tabs-back{margin-left:auto;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:7px;padding:10px 2px}

.conv-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.conv-toggles{position:absolute;top:16px;right:20px;display:flex;gap:8px;z-index:2}

.conv{flex:1;overflow:hidden;padding:30px 0 14px;display:flex;flex-direction:column;align-items:center}
.thread{width:100%;max-width:680px;padding:0 24px;display:flex;flex-direction:column;gap:20px}

.umsg .body{font-size:14.5px;color:var(--text);line-height:1.55}
.umsg .body p{margin-bottom:10px}
.umsg .body p:last-child{margin:0}

.reason{display:flex;align-items:center;gap:10px;background:var(--elevated);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;font-size:13px;color:var(--muted)}

.amsg p{margin-bottom:12px}
.amsg .lead{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text-2)}

/* ===== COMPOSER ===== */
.composer{flex:none;padding:12px 24px 18px;display:flex;flex-direction:column;align-items:center}

.inputbar .ph{flex:1;color:#6b6b72;font-size:14px}
.in-ic{color:#6b6b72}
.send{width:36px;height:36px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}

  name: `Studio`,
  desc: `Light — neutral`,
  style: `
/* ===================================================================
   Studio (Light) — LIGHT THEME
   Same markup + layout as the dark build. Only this :root block
   (tokens + shadow vars) changes between themes. Elevation philosophy
   is expressed entirely through tokens, so this is a pure token swap.
   =================================================================== */
:root{
  --page:#ECECEE;            /* behind the app frame */
  --black:#FFFFFF;           /* chrome: sidebar + topbar */
  --app:#F7F7F8;             /* main canvas (subtle cool grey) */
  --surface:#FFFFFF;         /* panels / empty cols / composer input */
  --card:#FFFFFF;            /* project card */
  --elevated:#F4F4F5;        /* reasoning / tool bars */
  --inset:#F1F1F3;           /* search fields, kbd, cat-pill, icon-sq */
  --chip:#F4F4F5;            /* composer chips */
  --pill:#F1F1F3;            /* date pill */
  --hover:#F0F0F2;           /* selected / hover row */
  --avatar:#C9C9CF;          /* avatar fill */
  --border:#E4E4E7;
  --border-2:#D9D9DE;
  --brand:#FF3986;           /* vivid: logo + active tab border */
  --brand-strong:#E5126A;    /* accessible fill, white label (4.5:1) */
  --brand-ink:#C70F58;       /* pink as text: active nav / tab (4.7:1) */
  --brand-tint:rgba(255,57,134,0.12);
  --text:#18181B;
  --text-2:#52525B;
  --muted:#71717A;
  --faint:#A1A1AA;           /* decorative icons + placeholders only */
  --green:#15803D;
  --green-bg:#ECFDF3;
  --cyan:#2563B8;            /* status / accent dot */
  /* flat / border-led: shadows essentially off */
  --sh-app:0 1px 3px rgba(20,18,30,.05);
  --sh-card:none;
  --sh-input:none;
  --glow:none;
  --radius:10px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;padding:30px 20px 60px}
.caption{max-width:1280px;margin:0 auto 10px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.caption b{color:var(--text)}

.app{max-width:1280px;margin:0 auto 42px;height:620px;display:flex;background:var(--app);
  border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh-app)}
svg{display:block}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-sm{width:15px;height:15px}

/* SIDEBAR */
.side{width:250px;flex:none;background:var(--black);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.side-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-weight:800;font-size:22px;color:var(--brand);font-family:var(--font);letter-spacing:-.04em}
.collapse{color:var(--faint)}
.side-body{flex:1;padding:8px 12px;overflow:hidden}
.search-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:9px 10px;margin-bottom:6px}
.kbd{margin-left:auto;font-size:10.5px;color:var(--faint);background:var(--inset);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:2px;cursor:default}
.nav.active{background:var(--brand-tint);color:var(--brand-ink)}
.side-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--faint);display:flex;align-items:center;justify-content:space-between;padding:18px 10px 8px}
.newchat{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);
  border:1px solid var(--border-2);border-radius:9px;padding:10px;margin-bottom:8px}
.chat-item{font-size:13px;color:var(--text-2);padding:9px 10px;border-radius:8px;cursor:default}
.chat-item.active{background:var(--hover);color:var(--text)}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.uava{width:26px;height:26px;border-radius:50%;background:var(--avatar);flex:none}
.uname{font-size:13px;font-weight:600}
.side-foot .grow{flex:1}
.fi{color:var(--faint)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:none;background:var(--black);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border)}
.page-h{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tb-right{display:flex;align-items:center;gap:12px}
.searchbox{width:200px;background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--faint);font-size:13px}
.btn-pink{background:var(--brand-strong);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:var(--glow)}
.icon-sq{width:34px;height:34px;border-radius:8px;background:var(--inset);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}

/* KANBAN */
.board{flex:1;padding:22px 24px;display:flex;gap:30px;overflow:hidden}
.col{flex:1;min-width:0}
.col-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;color:var(--text);font-size:15px;font-weight:600}
.col-h .ci{color:var(--muted)}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--sh-card)}
.proj-title{font-size:14px;font-weight:500;line-height:1.45;color:var(--text);padding-right:18px;position:relative}
.proj-title .chev{position:absolute;right:0;top:2px;color:var(--muted)}
.proj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.avstack{display:flex}
.avg{width:24px;height:24px;border-radius:50%;background:var(--avatar);border:2px solid var(--card);margin-left:-7px}
.avg:first-child{margin-left:0}
.date-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:var(--pill);border-radius:7px;padding:3px 9px}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}
.empty-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:13px}

/* WORKSPACE HEADER / TABS */
.ws-head{flex:none;background:var(--black);padding:14px 22px 0;border-bottom:1px solid var(--border)}
.ws-top{display:flex;align-items:flex-start;justify-content:space-between}
.ws-title{font-size:18px;font-weight:700;line-height:1.3;max-width:640px}
.ws-tools{display:flex;gap:13px;color:var(--faint);margin-top:7px}
.ws-right{display:flex;align-items:center;gap:12px}
.cat-pill{display:flex;align-items:center;gap:9px;background:var(--inset);border:1px solid var(--border-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text-2)}
.ws-right .avg{width:26px;height:26px;border:2px solid var(--black)}
.tabs{display:flex;gap:24px;margin-top:14px}
.tab{font-size:14px;color:var(--muted);padding:10px 2px;border-bottom:2px solid transparent;cursor:default}
.tab.active{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:500}
.tabs-back{margin-left:auto;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:7px;padding:10px 2px}

/* CONVERSATION */
.conv-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.conv-toggles{position:absolute;top:16px;right:20px;display:flex;gap:8px;z-index:2}
.tg{width:34px;height:34px;border-radius:8px;background:var(--brand-strong);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.conv{flex:1;overflow:hidden;padding:30px 0 14px;display:flex;flex-direction:column;align-items:center}
.thread{width:100%;max-width:680px;padding:0 24px;display:flex;flex-direction:column;gap:20px}

.umsg{display:flex;gap:13px}
.umsg .ava{width:30px;height:30px;border-radius:8px;background:var(--avatar);flex:none}
.umsg .body{font-size:14.5px;color:var(--text);line-height:1.55}
.umsg .body p{margin-bottom:10px}
.umsg .body p:last-child{margin:0}

.reason{display:flex;align-items:center;gap:10px;background:var(--elevated);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;font-size:13px;color:var(--muted);box-shadow:var(--sh-card)}
.reason .grow{flex:1}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-2);padding:3px 2px}
.step .grow{flex:1}
.check{width:18px;height:18px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;color:var(--green);flex:none}
.amsg{font-size:14.5px;color:var(--text);line-height:1.6}
.amsg p{margin-bottom:12px}
.amsg .lead{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text-2)}

/* COMPOSER */
.composer{flex:none;padding:12px 24px 18px;display:flex;flex-direction:column;align-items:center}
.composer-inner{width:100%;max-width:760px}
.chips{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);background:var(--chip);
  border:1px solid var(--border-2);border-radius:999px;padding:6px 12px}
.chip .ci{color:var(--muted)}
.inputbar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-2);
  border-radius:14px;padding:13px 14px;box-shadow:var(--sh-input)}
.inputbar .ph{flex:1;color:var(--faint);font-size:14px}
.in-ic{color:var(--faint)}
.send{width:36px;height:36px;border-radius:9px;background:var(--brand-strong);display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--glow)}

/* ===================================================================
   Atelier (Light) — LIGHT THEME
   Same markup + layout as the dark build. Only this :root block
   (tokens + shadow vars) changes between themes. Elevation philosophy
   is expressed entirely through tokens, so this is a pure token swap.
   =================================================================== */
:root{
  --page:#E8E4DC;            /* behind the app frame (warm) */
  --black:#F6F3EE;           /* chrome: sidebar + topbar (warm) */
  --app:#FCFAF6;             /* main canvas (warm paper) */
  --surface:#FFFFFF;         /* panels / empty cols / composer input */
  --card:#FFFFFF;            /* project card (clean white pops on paper) */
  --elevated:#F4F1EB;        /* reasoning / tool bars */
  --inset:#F1EDE6;           /* search fields, kbd, cat-pill, icon-sq */
  --chip:#F4F1EB;            /* composer chips */
  --pill:#F1EDE6;            /* date pill */
  --hover:#F0EBE3;           /* selected / hover row */
  --avatar:#CFC8BC;          /* avatar fill (warm) */
  --border:#E6E0D6;
  --border-2:#D8D0C4;
  --brand:#FF3986;           /* vivid: logo + active tab border */
  --brand-strong:#E5126A;    /* accessible fill, white label */
  --brand-ink:#B81259;       /* warm pink as text (5.2:1) */
  --brand-tint:rgba(255,57,134,0.12);
  --text:#1C1A17;
  --text-2:#57534E;
  --muted:#78716C;
  --faint:#A8A096;           /* decorative icons + placeholders only */
  --green:#15803D;
  --green-bg:#ECF7EE;
  --cyan:#1F5C8C;            /* warm navy status / accent */
  /* warm + minimal: hairline borders, shadows essentially off */
  --sh-app:0 1px 3px rgba(28,26,23,.06);
  --sh-card:none;
  --sh-input:none;
  --glow:none;
  --radius:10px;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;padding:30px 20px 60px}
.caption{max-width:1280px;margin:0 auto 10px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.caption b{color:var(--text)}

.app{max-width:1280px;margin:0 auto 42px;height:620px;display:flex;background:var(--app);
  border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh-app)}
svg{display:block}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-sm{width:15px;height:15px}

/* SIDEBAR */
.side{width:250px;flex:none;background:var(--black);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.side-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-weight:800;font-size:22px;color:var(--brand);font-family:var(--font);letter-spacing:-.04em}
.collapse{color:var(--faint)}
.side-body{flex:1;padding:8px 12px;overflow:hidden}
.search-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:9px 10px;margin-bottom:6px}
.kbd{margin-left:auto;font-size:10.5px;color:var(--faint);background:var(--inset);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:2px;cursor:default}
.nav.active{background:var(--brand-tint);color:var(--brand-ink)}
.side-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--faint);display:flex;align-items:center;justify-content:space-between;padding:18px 10px 8px}
.newchat{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);
  border:1px solid var(--border-2);border-radius:9px;padding:10px;margin-bottom:8px}
.chat-item{font-size:13px;color:var(--text-2);padding:9px 10px;border-radius:8px;cursor:default}
.chat-item.active{background:var(--hover);color:var(--text)}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
.uava{width:26px;height:26px;border-radius:50%;background:var(--avatar);flex:none}
.uname{font-size:13px;font-weight:600}
.side-foot .grow{flex:1}
.fi{color:var(--faint)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:none;background:var(--black);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border)}
.page-h{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tb-right{display:flex;align-items:center;gap:12px}
.searchbox{width:200px;background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--faint);font-size:13px}
.btn-pink{background:var(--brand-strong);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:var(--glow)}
.icon-sq{width:34px;height:34px;border-radius:8px;background:var(--inset);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}

/* KANBAN */
.board{flex:1;padding:22px 24px;display:flex;gap:30px;overflow:hidden}
.col{flex:1;min-width:0}
.col-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;color:var(--text);font-size:15px;font-weight:600}
.col-h .ci{color:var(--muted)}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--sh-card)}
.proj-title{font-size:14px;font-weight:500;line-height:1.45;color:var(--text);padding-right:18px;position:relative}
.proj-title .chev{position:absolute;right:0;top:2px;color:var(--muted)}
.proj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.avstack{display:flex}
.avg{width:24px;height:24px;border-radius:50%;background:var(--avatar);border:2px solid var(--card);margin-left:-7px}
.avg:first-child{margin-left:0}
.date-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:var(--pill);border-radius:7px;padding:3px 9px}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}
.empty-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:13px}

/* WORKSPACE HEADER / TABS */
.ws-head{flex:none;background:var(--black);padding:14px 22px 0;border-bottom:1px solid var(--border)}
.ws-top{display:flex;align-items:flex-start;justify-content:space-between}
.ws-title{font-size:18px;font-weight:700;line-height:1.3;max-width:640px}
.ws-tools{display:flex;gap:13px;color:var(--faint);margin-top:7px}
.ws-right{display:flex;align-items:center;gap:12px}
.cat-pill{display:flex;align-items:center;gap:9px;background:var(--inset);border:1px solid var(--border-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text-2)}
.ws-right .avg{width:26px;height:26px;border:2px solid var(--black)}
.tabs{display:flex;gap:24px;margin-top:14px}
.tab{font-size:14px;color:var(--muted);padding:10px 2px;border-bottom:2px solid transparent;cursor:default}
.tab.active{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:500}
.tabs-back{margin-left:auto;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:7px;padding:10px 2px}

/* CONVERSATION */
.conv-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.conv-toggles{position:absolute;top:16px;right:20px;display:flex;gap:8px;z-index:2}
.tg{width:34px;height:34px;border-radius:8px;background:var(--brand-strong);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.conv{flex:1;overflow:hidden;padding:30px 0 14px;display:flex;flex-direction:column;align-items:center}
.thread{width:100%;max-width:680px;padding:0 24px;display:flex;flex-direction:column;gap:20px}

.umsg{display:flex;gap:13px}
.umsg .ava{width:30px;height:30px;border-radius:8px;background:var(--avatar);flex:none}
.umsg .body{font-size:14.5px;color:var(--text);line-height:1.55}
.umsg .body p{margin-bottom:10px}
.umsg .body p:last-child{margin:0}

.reason{display:flex;align-items:center;gap:10px;background:var(--elevated);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;font-size:13px;color:var(--muted);box-shadow:var(--sh-card)}
.reason .grow{flex:1}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-2);padding:3px 2px}
.step .grow{flex:1}
.check{width:18px;height:18px;border-radius:50%;background:var(--green-bg);display:grid;place-items:center;color:var(--green);flex:none}
.amsg{font-size:14.5px;color:var(--text);line-height:1.6}
.amsg p{margin-bottom:12px}
.amsg .lead{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--text-2)}

/* COMPOSER */
.composer{flex:none;padding:12px 24px 18px;display:flex;flex-direction:column;align-items:center}
.composer-inner{width:100%;max-width:760px}
.chips{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);background:var(--chip);
  border:1px solid var(--border-2);border-radius:999px;padding:6px 12px}
.chip .ci{color:var(--muted)}
.inputbar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border-2);
  border-radius:14px;padding:13px 14px;box-shadow:var(--sh-input)}
.inputbar .ph{flex:1;color:var(--faint);font-size:14px}
.in-ic{color:var(--faint)}
.send{width:36px;height:36px;border-radius:9px;background:var(--brand-strong);display:grid;place-items:center;color:#fff;flex:none;box-shadow:var(--glow)}

   Aurora (Light) — LIGHT THEME

:root{

  --pill:#EFEEF5;            /* date pill */
  --hover:#F0EFF6;           /* selected / hover row */
  --avatar:#C7C5D2;          /* avatar fill (cool) */
  --border:#E7E5EE;
  --border-2:#DAD8E4;
  --brand:#FF3986;           /* vivid: logo + active tab border */
  --brand-strong:#E5126A;    /* accessible fill, white label */
  --brand-ink:#C70F58;       /* pink as text: active nav / tab */
  --brand-tint:rgba(255,57,134,0.13);
  --text:#18171C;
  --text-2:#51505A;
  --muted:#6E6D78;
  --faint:#A6A4B2;           /* decorative icons + placeholders only */
  --green:#15803D;
  --green-bg:#EAF8EF;
  --cyan:#2D5FB8;            /* status / accent dot */
  /* depth-led: soft cool shadows do the elevation, plus a brand glow */
  --sh-app:0 18px 50px rgba(20,18,30,.14);
  --sh-card:0 6px 20px rgba(20,18,30,.08);
  --sh-input:0 6px 20px rgba(20,18,30,.08);
  --glow:0 4px 16px rgba(255,57,134,.32);

}

body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased;padding:30px 20px 60px}
